<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Courses</title>
  <link rel="stylesheet" href="course.css">
</head>

<body>
  <a id="back" href="index.html">&lt &nbsp Back</a>
  <h1>Manage Courses</h1>

  <section id="create-course">
    <h2>Create Course</h2>
    <form id="course-form">
      <label>Term Code: <input type="number" id="termCode" required></label>
      <label>Course Name: <input type="text" id="courseName" maxlength="100" required></label>
      <label>Section: <input type="number" id="section" value="1" required></label>
      <button type="submit" id="courseSubmit">Add Course</button>
    </form>
  </section>

  <br>

  <section id="modify-course">
    <h2>Modify Course</h2>
    <form id="modify-form">
      <label>Term Code: <input type="number" id="modTermCode" required></label>
      <label>Current Section: <input type="number" id="modSection" value="1" required></label>
      <label>New Course Name: <input type="text" id="modCourseName" maxlength="100"></label>
      <label>New Section: <input type="number" id="modNewSection"></label>
      <button type="submit" id="modifySubmit">Modify Course</button>
    </form>
    <div id="modify-error" class="error"></div>
  </section>

  <br>

  <section id="course-list">
    <h2>Existing Courses</h2>
    <ul id="courses"></ul>
  </section>


  <script defer src="course.js"></script>
</body>

</html>
