<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Course Members</title>
    <link rel="stylesheet" href="member.css">
</head>

<body>
    <a id="back" href="index.html">&lt &nbsp Back</a>
    <h1>Manage Course Members</h1>

    <form id="member-add-form">
        <h2>Add Members</h2>
        <label>Term Code: <input type="number" id="memberAddTermCode" required></label>

        <label>Section: <input type="number" id="memberAddSection" value="1" required></label>

        <label>Members (one per line):</label>
        <textarea id="memberAddList" rows="5" placeholder="M0000001, John, Smith, student"></textarea>

        <button type="submit">Add Members</button>
        <div id="memberAddResult" class="result-box"></div>
    </form>

    <br>

    <form id="member-delete-form">
        <h2>Delete Members</h2>
        <label>Term Code: <input type="number" id="memberDeleteTermCode" required></label>

        <label>Section: <input type="number" id="memberDeleteSection" value="1" required></label>

        <label>Member IDs:</label>
        <input type="text" id="memberDeleteList" placeholder="M0000001, M0000002, ..." required>

        <button type="submit">Delete Members</button>
        <div id="memberDeleteResult" class="result-box"></div>
    </form>

    <br>

    <form id="member-get-form">
        <h2>Get Members</h2>
        <label>Term Code: <input type="number" id="memberGetTermCode" required></label>

        <label>Section: <input type="number" id="memberGetSection" value="1"></label>

        <label>Role: <input type="text" id="memberGetRole"></label>

        <button type="submit">Get Members</button>
        <div id="memberGetResult" class="result-box"></div>
    </form>

    <script src="member.js"></script>
</body>

</html>
