<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up for Slots</title>
    <link rel="stylesheet" href="signupMem.css" />
</head>

<body>
    <a id="back" href="index.html">&lt &nbsp Back</a>
    <h1>Sign Up for Slots</h1>

    <section id="view-slots">
        <h2>View Slots</h2>
        <form id="view-form">
            <label>Signup ID: <input type="number" id="viewSignupId" required></label>
            <button type="submit">View Slots</button>
        </form>
        <ul id="slots"></ul>
    </section>

    <br>

    <section id="signup-section">
        <h2>Sign Up for a Slot</h2>
        <form id="signup-form">
            <label>Signup ID: <input type="number" id="signupId" required></label>
            <label>Slot ID: <input type="number" id="slotId" required></label>
            <label>Member ID: <input type="text" id="memberId" required></label>
            <button type="submit">Sign Up</button>
        </form>
    </section>

    <br>

    <section id="remove-section">
        <h2>Remove a Sign-Up</h2>
        <form id="remove-form">
            <label>Signup ID: <input type="number" id="removeSignupId" required></label>
            <label>Member ID: <input type="text" id="removeMemberId" required></label>
            <button type="submit">Remove</button>
        </form>
    </section>

    <script src="signupMem.js"></script>
</body>

</html>
