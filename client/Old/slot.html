<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Slots</title>
    <link rel="stylesheet" href="slot.css" />
</head>

<body>
    <a id="back" href="index.html">&lt &nbsp Back</a>
    <h1>Manage Slots</h1>

    <section>
        <h2>Add Slots</h2>
        <form id="slot-form">
            <label>Signup ID: <input type="number" id="signupId" required></label>
            <label>Start Time: <input type="datetime-local" id="start" required></label>
            <label>Slot Duration: <input type="number" id="slotDuration" required></label>
            <label>Number of Slots: <input type="number" id="numSlots" required></label>
            <label>Max Members per Slot: <input type="number" id="maxMembers" required></label>
            <button type="submit">Add Slots</button>
        </form>
    </section>

    <br>

    <section>
        <h2>Modify Slot</h2>
        <form id="modify-form">
            <label>Slot ID: <input type="number" id="modSlotId" required></label>
            <label>Start Time: <input type="datetime-local" id="modStart"></label>
            <label>Duration: <input type="number" id="modDuration"></label>
            <label>Max Members: <input type="number" id="modMaxMembers"></label>
            <button type="submit">Modify Slot</button>
        </form>
    </section>

    <br>

    <section>
        <h2>View Slots</h2>
        <form id="view-form">
            <label>Signup ID: <input type="number" id="viewSignupId" required></label>
            <button type="submit">View</button>
        </form>
        <ul id="slots"></ul>
    </section>

    <script src="slot.js"></script>
</body>

</html>
