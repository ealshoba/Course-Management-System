<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Signup Sheets</title>
    <link rel="stylesheet" href="signup.css" />
</head>

<body>
    <a id="back" href="index.html">&lt &nbsp Back</a>
    <h1>Manage Signup Sheets</h1>

    <section id="create-signup">
        <h2>Create Signup Sheet</h2>
        <form id="signup-form">
            <label>Term Code: <input type="number" id="termCode" required /></label>
            <label>Section: <input type="number" id="section" value="1" required /></label>
            <label>Assignment Name: <input type="text" id="assignmentName" maxlength="100" required /></label>
            <label>Not Before: <input type="datetime-local" id="notBefore" required /></label>
            <label>Not After: <input type="datetime-local" id="notAfter" required /></label>
            <button type="submit" id="signupSubmit">Add Signup Sheet</button>
        </form>
    </section>

    <br>

    <section id="signup-list">
        <h2>Signup Sheets</h2>
        <form id="filter-form">
            <label>Term Code: <input type="number" id="filterTermCode" required /></label>
            <label>Section: <input type="number" id="filterSection" value="1" /></label>
            <button type="submit">Load</button>
        </form>
        <ul id="signups"></ul>
    </section>

    <script defer src="signup.js"></script>
</body>

</html>
